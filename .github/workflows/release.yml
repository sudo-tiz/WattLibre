name: Release APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Read version from Gradle
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          from pathlib import Path
          source = Path("app/build.gradle.kts").read_text()
          name = re.search(r'^\s*versionName\s*=\s*"([^"\n]+)"\s*$', source, re.M)
          code = re.search(r'^\s*versionCode\s*=\s*(\d+)\s*$', source, re.M)
          if not name or not code or not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", name[1]):
              raise SystemExit("Set a SemVer versionName and integer versionCode in app/build.gradle.kts")
          if int(code[1]) < 1:
              raise SystemExit("versionCode must be positive")
          print(f"name={name[1]}")
          print(f"code={code[1]}")
          print(f"tag=v{name[1]}")
          PY

      - name: Check release tag
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Run the release workflow from main." >&2
              exit 1
          fi
          git fetch --force --tags origin

          if git show-ref --tags --verify --quiet "refs/tags/$VERSION_TAG"; then
              tagged_file=$(git show "$VERSION_TAG:app/build.gradle.kts")
              tagged_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^\"]+)".*/\1/p' <<< "$tagged_file" | head -n1)
              tagged_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' <<< "$tagged_file" | head -n1)
              if [[ "$tagged_name" != "$VERSION_NAME" || "$tagged_code" != "$VERSION_CODE" ]]; then
                  echo "This versionName is already tagged with different Gradle version values." >&2
                  exit 1
              fi
              if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
                  echo "publish=false" >> "$GITHUB_OUTPUT"
                  echo "tag_exists=true" >> "$GITHUB_OUTPUT"
                  echo "$VERSION_TAG is already released; nothing to do."
                  exit 0
              fi
              git checkout "$VERSION_TAG"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
              latest_code=0
              while read -r previous_tag; do
                  previous_code=$(git show "$previous_tag:app/build.gradle.kts" 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' | head -n1 || true)
                  if [[ "$previous_code" =~ ^[0-9]+$ ]] && (( previous_code > latest_code )); then
                      latest_code=$previous_code
                  fi
              done < <(git tag --list 'v*')
              if (( VERSION_CODE <= latest_code )); then
                  echo "Increase versionCode above $latest_code for a new release." >&2
                  exit 1
              fi
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.release_check.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/my-release-key.jks

      - name: Build signed APK
        if: steps.release_check.outputs.publish == 'true'
        env:
          KEYSTORE_FILE: my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Create tag and GitHub release
        if: steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.release_check.outputs.tag_exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" != "true" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$VERSION_TAG" -m "Release $VERSION_TAG"
              git push origin "$VERSION_TAG"
          fi
          gh release create "$VERSION_TAG" app/build/outputs/apk/release/app-release.apk --title "$VERSION_TAG" --generate-notes

      - name: Remove release keystore
        if: always() && steps.release_check.outputs.publish == 'true'
        run: rm -f app/my-release-key.jks
